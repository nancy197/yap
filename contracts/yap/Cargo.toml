[package]
name = "yap"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
near-contract-standards = "=5.30.1"
serde_json = "1"
borsh = "1"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing", "legacy"] }
near-workspaces = "=0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
